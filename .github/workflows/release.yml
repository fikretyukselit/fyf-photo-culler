name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            sidecar_name: fyf-backend-aarch64-apple-darwin
            sidecar_sep: ":"
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            sidecar_name: fyf-backend-x86_64-apple-darwin
            sidecar_sep: ":"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar_name: fyf-backend-x86_64-pc-windows-msvc.exe
            sidecar_sep: ";"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            sidecar_name: fyf-backend-x86_64-unknown-linux-gnu
            sidecar_sep: ":"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install pyinstaller
          pip install fastapi "uvicorn[standard]" opencv-python-headless Pillow imagehash scikit-image tqdm numpy

      - name: Build Python sidecar
        shell: bash
        run: |
          pyinstaller --onefile --name fyf-backend backend/server.py \
            --hidden-import culling \
            --add-data "culling${{ matrix.sidecar_sep }}culling" \
            --distpath dist/
          mkdir -p ui/src-tauri/binaries
          cp dist/fyf-backend* ui/src-tauri/binaries/${{ matrix.sidecar_name }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: ui
        run: bun install

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: ui
          tauriScript: bun run tauri
          args: --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify macOS bundle signature and architecture
        if: contains(matrix.target, 'apple-darwin')
        env:
          MACOS_TARGET: ${{ matrix.target }}
        run: >-
          python3 scripts/verify_macos_bundle.py
          "ui/src-tauri/target/$MACOS_TARGET/release/bundle/macos/FYF Photo Culler.app"
          --target "$MACOS_TARGET" --smoke-test

      - name: Rename macOS updater artifacts to include arch
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          BUNDLE_DIR="ui/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          ARCH="${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x64' }}"
          for f in "$BUNDLE_DIR"/*.app.tar.gz; do
            [ -f "$f" ] && mv "$f" "$BUNDLE_DIR/FYF Photo Culler_${ARCH}.app.tar.gz"
          done
          for f in "$BUNDLE_DIR"/*.app.tar.gz.sig; do
            [ -f "$f" ] && mv "$f" "$BUNDLE_DIR/FYF Photo Culler_${ARCH}.app.tar.gz.sig"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz.sig
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe.sig
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi.sig
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage.sig

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "tag=v${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG="${{ github.ref_name }}"
            echo "version=${TAG#v}" >> $GITHUB_OUTPUT
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare stable README download assets
        run: python3 scripts/prepare_release_downloads.py artifacts stable-downloads

      - name: Generate latest.json for auto-updater
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: >-
          python3 scripts/generate_updater_manifest.py artifacts latest.json
          --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "FYF Photo Culler ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.app.tar.gz.sig
            artifacts/**/*.exe
            artifacts/**/*.exe.sig
            artifacts/**/*.msi
            artifacts/**/*.msi.sig
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.AppImage.sig
            stable-downloads/*
            latest.json
